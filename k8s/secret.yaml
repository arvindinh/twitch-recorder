apiVersion: v1
kind: Secret
metadata:
  name: twitch-recorder-secrets
type: Opaque
stringData:
  TWITCH_CLIENT_ID: "your_twitch_client_id_here"
  TWITCH_CLIENT_SECRET: "your_twitch_client_secret_here"
  TWITCH_USER_TOKEN: "your_twitch_user_token_here"
  TWITCH_REFRESH_TOKEN: "your_twitch_refresh_token_here"
  TARGET_USERNAME: "shroud"
  QUALITY: "best"
  OUTPUT_DIR: "/app/downloads"
  AIRFLOW_API_URL: "http://airflow-webserver.default.svc.cluster.local:8080/api/v1/dags/upload_twitch_vods_to_youtube/dagRuns"
  AIRFLOW_USERNAME: "airflow"
  AIRFLOW_PASSWORD: "your_airflow_password_here"
